name: UBTurbo-IO-Validation

on:
  workflow_call:
    inputs:
      pr_id:
        description: Pull request number
        required: true
        type: string
      target_branch:
        description: Pull request target branch
        required: true
        type: string
      merge_commit_sha:
        description: Pull request merge commit
        required: true
        type: string

env:
  PR_ID: ${{ inputs.pr_id }}
  TARGET_BRANCH: ${{ inputs.target_branch }}

defaults:
  run:
    shell: bash

permissions:
  repository: read
  pr: none
  issue: none
  note: none
  project: none

stages:
  checks_stage:
    name: Checks
    fail_fast: false
    jobs:
      pre_commit:
        name: pre-commit
        if: ${{ inputs.target_branch == 'master' }}
        runs-on: [self-hosted, ubse, arm, cpu=8]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ubscore/soe:latest

        steps:
          - name: Checkout PR merge code
            uses: checkout
            with:
              ref: ${{ inputs.merge_commit_sha }}
              allow-unsafe-pr-checkout: true

          - name: Install pre-commit dependencies
            run: |
              set -euxo pipefail

              sudo dnf install -y \
                dnf-plugins-core \
                python3 \
                python3-pip \
                clang-tools-extra \
                rdma-core-devel \
                libvirt-devel

              if ! command -v python >/dev/null 2>&1; then
                sudo ln -s "$(command -v python3)" /usr/bin/python
              fi
              python --version
              python3 --version
              clang-format --version

          - name: Prepare clang-format check
            run: |
              set -euxo pipefail
              sed -i 's/, -i/, -n, --Werror/g' .pre-commit-config.yaml

          - name: Run pre-commit
            uses: openlibing/pre-commit-action@v1.0.1
            env:
              SKIP: run-build,run-build-test,clang-tidy,clang-tidy-test
            with:
              extra_args: --all-files

          - name: Save result
            if: ${{ always() }}
            env:
              CURRENT_JOB_STATUS: ${{ job.status }}
            run: |
              mkdir -p .ci-results
              if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
                echo "SUCCESS" > .ci-results/pre-commit
              else
                echo "FAILED" > .ci-results/pre-commit
              fi

              echo "pre-commit: ${CURRENT_JOB_STATUS}" >> "${ATOMGIT_STEP_SUMMARY}"

          - name: Upload result
            if: ${{ always() }}
            uses: upload-artifact
            with:
              name: ci-result-pre-commit
              path: .ci-results/pre-commit

      build_x86_64:
        name: build-x86-64
        runs-on: [self-hosted, ubse, x86, cpu=8]
        timeout-minutes: 5

        steps:
          - name: Preserve legacy x86_64 status
            run: |
              set -euo pipefail
              echo "UBTurbo 仅支持 aarch64；上游 x86_64 检查为历史占位项，保持 SUCCESS。"
              echo "x86_64=NOT_APPLICABLE" >> "${ATOMGIT_STEP_SUMMARY}"

          - name: Save result
            if: ${{ always() }}
            env:
              CURRENT_JOB_STATUS: ${{ job.status }}
            run: |
              mkdir -p .ci-results
              if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
                echo "SUCCESS" > .ci-results/x86_64
              else
                echo "FAILED" > .ci-results/x86_64
              fi

          - name: Upload result
            if: ${{ always() }}
            uses: upload-artifact
            with:
              name: ci-result-x86-64
              path: .ci-results/x86_64

      build_aarch64:
        name: build-aarch64
        runs-on: [self-hosted, ubse, arm, cpu=8]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/openeuler/aarch64/ci/common:24.03-lts-sp1-rust

        steps:
          - name: Checkout PR merge code
            uses: checkout
            with:
              ref: ${{ inputs.merge_commit_sha }}
              allow-unsafe-pr-checkout: true

          - name: Install build dependencies
            run: |
              set -euxo pipefail

              sudo yum install -y \
                gcc \
                gcc-c++ \
                make \
                cmake \
                git \
                wget \
                dos2unix \
                libboundscheck \
                libvirt \
                libvirt-devel \
                rapidjson \
                numactl-devel

              kernel_rpm="kernel-devel-6.6.0-145.3.13.143.oe2403sp3.aarch64.rpm"
              wget -q \
                "https://dailybuild.openeuler.openatom.cn/repo.openeuler.org/openEuler-24.03-LTS-SP3/update_20260527/aarch64/Packages/${kernel_rpm}"
              sudo rpm -ivh --nosignature --force "${kernel_rpm}"

              ldd --version

          - name: Build UBTurbo and SMAP
            run: |
              set -euxo pipefail

              jobs="$(nproc)"

              echo "Building UBTurbo"
              bash build.sh -c

              kernel_build="$(
                find /lib/modules -mindepth 2 -maxdepth 2 -name build \
                  -print 2>/dev/null | sort -V | tail -n 1
              )"
              if [[ -z "${kernel_build}" ]]; then
                kernel_build="$(
                  find /usr/src/kernels -mindepth 1 -maxdepth 1 -type d \
                    -print 2>/dev/null | sort -V | tail -n 1
                )"
              fi
              if [[ -z "${kernel_build}" ]]; then
                echo "Kernel development tree not found" >&2
                exit 1
              fi
              echo "Using kernel build directory: ${kernel_build}"

              echo "Building SMAP kernel components for ${TARGET_BRANCH}"
              if [[ "${TARGET_BRANCH}" == "br_UnifiedBus" ]]; then
                (
                  cd plugins/smap/src/drivers
                  make -j"${jobs}" -C "${kernel_build}" M="${PWD}" modules
                )
                cp plugins/smap/src/drivers/Module.symvers \
                  plugins/smap/src/tiering/depends/Module.symvers
                (
                  cd plugins/smap/src/tiering
                  make -j"${jobs}" -C "${kernel_build}" M="${PWD}" modules
                )
              else
                (
                  cd plugins/smap/src/kernel
                  make -j"${jobs}" -C "${kernel_build}" M="${PWD}" modules
                )
              fi

              (
                cd plugins/smap/src/ucache
                make -j"${jobs}" -C "${kernel_build}" M="${PWD}" modules
              )

              (
                cd plugins/smap
                cmake -DCMAKE_BUILD_TYPE=Release .
                make -j"${jobs}" install
              )

          - name: Prepare SMAP DT dependencies
            run: |
              set -euxo pipefail

              cd plugins/smap/test/3rdparty

              if [[ -d mockcpp/.git ]]; then
                git -C mockcpp fetch --depth=1 origin tag v2.7
                git -C mockcpp checkout -f v2.7
              else
                git clone --depth=1 --branch v2.7 \
                  https://gitee.com/mirrors_sinojelly/mockcpp.git mockcpp
              fi

              if [[ -d googletest/.git ]]; then
                git -C googletest fetch --depth=1 origin tag release-1.12.1
                git -C googletest checkout -f release-1.12.1
              else
                git clone --depth=1 --branch release-1.12.1 \
                  https://gitee.com/mirrors/googletest.git googletest
              fi

          - name: Run SMAP DT
            run: |
              set -euxo pipefail
              cd plugins/smap/test
              cp run_dt.sh run_dt.ci.sh
              sed -i '$d' run_dt.ci.sh
              sed -i '$d' run_dt.ci.sh
              sed -i '$d' run_dt.ci.sh
              bash run_dt.ci.sh

          - name: Save result
            if: ${{ always() }}
            env:
              CURRENT_JOB_STATUS: ${{ job.status }}
            run: |
              mkdir -p .ci-results
              if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
                echo "SUCCESS" > .ci-results/aarch64
              else
                echo "FAILED" > .ci-results/aarch64
              fi

              echo "aarch64: ${CURRENT_JOB_STATUS}" >> "${ATOMGIT_STEP_SUMMARY}"

          - name: Upload result
            if: ${{ always() }}
            uses: upload-artifact
            with:
              name: ci-result-aarch64
              path: .ci-results/aarch64

      dt:
        name: DT
        runs-on: [self-hosted, ubse, arm, cpu=8]
        timeout-minutes: 60
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ubscore/openeuler-24.03-lts-sp3_ci_build:latest

        steps:
          - name: Checkout PR merge code
            uses: checkout
            with:
              ref: ${{ inputs.merge_commit_sha }}
              allow-unsafe-pr-checkout: true

          - name: Install dependencies
            run: |
              set -euxo pipefail

              sudo dnf install -y \
                gcc \
                gcc-c++ \
                make \
                cmake \
                git \
                wget \
                unzip \
                perl \
                perl-Capture-Tiny \
                patch \
                dos2unix \
                libboundscheck \
                libvirt-devel \
                gmock-devel

              for tool in gcc g++ make cmake unzip wget perl dos2unix; do
                if ! command -v "${tool}" >/dev/null 2>&1; then
                  echo "MISSING TOOL: ${tool}" >&2
                  exit 1
                fi
              done

          - name: Prepare UT dependencies
            run: |
              set -euxo pipefail

              git clone --depth=1 --branch v2.7 \
                https://gitee.com/mirrors_sinojelly/mockcpp.git \
                test/3rdparty/mockcpp

              git clone --depth=1 \
                https://gitee.com/mirrors/googletest.git \
                test/3rdparty/googletest

              git clone --depth=1 \
                https://gitee.com/Tencent/RapidJSON.git \
                3rdparty/rapidjson

              git clone --depth=1 \
                https://gitee.com/mirror-luyi/spdlog.git \
                plugins/smap/3rdparty/spdlog

              mkdir -p plugins/smap/test/3rdparty/mockcpp
              mkdir -p plugins/smap/test/3rdparty/googletest

              cp -a test/3rdparty/mockcpp/. \
                plugins/smap/test/3rdparty/mockcpp/
              cp -a test/3rdparty/googletest/. \
                plugins/smap/test/3rdparty/googletest/

          - name: Run UBTurbo UT
            run: |
              set -euxo pipefail
              cd test
              bash -e run_ut.sh

          - name: Upload UT reports
            if: ${{ always() }}
            uses: upload-artifact
            with:
              name: ubturbo-ut
              path: |
                test/build/gcovr_report/
                test/build/coverage.info

          - name: Save result
            if: ${{ always() }}
            env:
              CURRENT_JOB_STATUS: ${{ job.status }}
            run: |
              mkdir -p .ci-results
              if [[ "${CURRENT_JOB_STATUS}" == "success" ]]; then
                echo "SUCCESS" > .ci-results/DT
              else
                echo "FAILED" > .ci-results/DT
              fi

              echo "DT: ${CURRENT_JOB_STATUS}" >> "${ATOMGIT_STEP_SUMMARY}"

          - name: Upload result
            if: ${{ always() }}
            uses: upload-artifact
            with:
              name: ci-result-dt
              path: .ci-results/DT

