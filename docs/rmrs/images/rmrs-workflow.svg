<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" data-diagram="rmrs-workflow">
  <title id="title">RMRS decision and execution workflow</title><desc id="desc">A trusted resource manager sends a request to RMRS over UBTurbo IPC. RMRS validates it, calculates a plan, calls SMAP for scanning and migration, and reports a result for commit or rollback.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#40566f"/></marker><style>.b{fill:#f7f9fc;stroke:#40566f;stroke-width:2}.g{fill:#ebf7ee}.y{fill:#fff4df}.t{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#172b3a;text-anchor:middle}.h{font-size:21px;font-weight:700}.s{font-size:16px}.l{stroke:#40566f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="560" fill="#fff"/><text class="t h" x="600" y="35">RMRS decision and execution workflow</text>
  <rect class="b" x="30" y="90" width="190" height="95" rx="10"/><text class="t s" x="125" y="126" font-weight="700">Trusted manager</text><text class="t s" x="125" y="155">PID · NUMA · target</text>
  <rect class="b g" x="280" y="90" width="190" height="95" rx="10"/><text class="t h" x="375" y="126">UBTurbo IPC</text><text class="t s" x="375" y="155">RMRS handler</text>
  <rect class="b g" x="530" y="90" width="190" height="95" rx="10"/><text class="t h" x="625" y="126">Validation</text><text class="t s" x="625" y="155">shape · count · range</text>
  <rect class="b g" x="780" y="90" width="190" height="95" rx="10"/><text class="t h" x="875" y="126">Strategy</text><text class="t s" x="875" y="155">capacity allocation</text>
  <rect class="b y" x="780" y="280" width="190" height="95" rx="10"/><text class="t h" x="875" y="316">SMAP</text><text class="t s" x="875" y="345">scan · select · migrate</text>
  <rect class="b" x="1030" y="280" width="140" height="95" rx="10"/><text class="t h" x="1100" y="316">NUMA</text><text class="t s" x="1100" y="345">local / remote</text>
  <rect class="b" x="530" y="430" width="190" height="80" rx="10"/><text class="t h" x="625" y="465">Result</text><text class="t s" x="625" y="492">success / partial / error</text>
  <rect class="b" x="280" y="430" width="190" height="80" rx="10"/><text class="t s" x="375" y="465" font-weight="700">Commit or rollback</text><text class="t s" x="375" y="492">business transaction</text>
  <path class="l" d="M220 137H280"/><path class="l" d="M470 137H530"/><path class="l" d="M720 137H780"/><path class="l" d="M875 185V280"/><path class="l" d="M970 327H1030"/><path class="l" d="M780 350L720 450"/><path class="l" d="M530 470H470"/><path class="l" d="M280 470C130 470 125 300 125 185"/>
</svg>
