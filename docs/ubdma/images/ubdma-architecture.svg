<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc" data-diagram="ubdma-architecture">
  <title id="title">UBDMA components and data flow</title><desc id="desc">A kernel caller submits DMA descriptors. UBDMA resolves registered URMA segments, sends work requests through a Jetty to UB hardware, and reports completion through the interrupt path.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#40566f"/></marker><style>.b{fill:#f7f9fc;stroke:#40566f;stroke-width:2}.t{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#172b3a;text-anchor:middle}.h{font-size:21px;font-weight:700}.s{font-size:16px}.l{stroke:#40566f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="470" fill="#fff"/><text class="t h" x="600" y="38">UBDMA control and data path</text>
  <rect class="b" x="40" y="100" width="190" height="90" rx="10"/><text class="t h" x="135" y="136">Kernel caller</text><text class="t s" x="135" y="165">DMA descriptor</text>
  <rect class="b" fill="#e9f3ff" x="290" y="100" width="190" height="90" rx="10"/><text class="t h" x="385" y="136">DMA engine</text><text class="t s" x="385" y="165">channel · submit</text>
  <rect class="b" fill="#ebf7ee" x="540" y="100" width="190" height="90" rx="10"/><text class="t h" x="635" y="136">URMA path</text><text class="t s" x="635" y="165">Jetty · work queue</text>
  <rect class="b" fill="#fff4df" x="790" y="100" width="190" height="90" rx="10"/><text class="t h" x="885" y="136">UB hardware</text><text class="t s" x="885" y="165">remote copy</text>
  <rect class="b" x="540" y="290" width="190" height="90" rx="10"/><text class="t s" x="635" y="326" font-weight="700">Segment manager</text><text class="t s" x="635" y="355">register · lookup</text>
  <rect class="b" x="790" y="290" width="190" height="90" rx="10"/><text class="t s" x="885" y="326" font-weight="700">Memory notifier</text><text class="t s" x="885" y="355">online · offline</text>
  <rect class="b" x="1010" y="100" width="160" height="90" rx="10"/><text class="t h" x="1090" y="136">Completion</text><text class="t s" x="1090" y="165">interrupt · release</text>
  <path class="l" d="M230 145H290"/><path class="l" d="M480 145H540"/><path class="l" d="M730 145H790"/><path class="l" d="M980 145H1010"/><path class="l" d="M635 290V190"/><path class="l" d="M790 335H730"/><path class="l" d="M1090 190V420H385V190"/>
</svg>
