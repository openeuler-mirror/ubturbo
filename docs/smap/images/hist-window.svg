<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc" data-diagram="hist-window">
  <title id="title">HIST coarse-to-fine sliding-window scan</title><desc id="desc">Physical memory is scanned in coarse aligned windows. Hot candidate windows are selected and rescanned at fine page granularity before results are aggregated.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#40566f"/></marker><style>.b{stroke:#40566f;stroke-width:2}.t{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#172b3a;text-anchor:middle}.h{font-size:21px;font-weight:700}.s{font-size:16px}.l{stroke:#40566f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="460" fill="#fff"/><text class="t h" x="600" y="36">HIST coarse-to-fine window scan</text>
  <rect class="b" fill="#e9f3ff" x="55" y="110" width="220" height="100" rx="10"/><text class="t h" x="165" y="150">Coarse scan</text><text class="t s" x="165" y="178">aligned large windows</text>
  <rect class="b" fill="#fff4df" x="355" y="110" width="220" height="100" rx="10"/><text class="t h" x="465" y="150">Rank windows</text><text class="t s" x="465" y="178">MAX / AVG policy</text>
  <rect class="b" fill="#ffe5e5" x="655" y="110" width="220" height="100" rx="10"/><text class="t h" x="765" y="150">Fine scan</text><text class="t s" x="765" y="178">candidate hot windows</text>
  <rect class="b" fill="#ebf7ee" x="955" y="110" width="190" height="100" rx="10"/><text class="t h" x="1050" y="150">Aggregate</text><text class="t s" x="1050" y="178">page frequencies</text>
  <path class="l" d="M275 160H355"/><path class="l" d="M575 160H655"/><path class="l" d="M875 160H955"/>
  <rect class="b" fill="#f7f9fc" x="180" y="300" width="840" height="70" rx="8"/><rect fill="#ef6a6a" x="350" y="302" width="95" height="66"/><rect fill="#ef6a6a" x="715" y="302" width="125" height="66"/><text class="t s" x="600" y="405">Highlighted coarse windows are rescanned at finer granularity.</text>
</svg>
