# SMAP strategy period config
# Installed by ubturbo-smap RPM; %config(noreplace) preserves user edits on upgrade.
# Lines starting with '#' are comments and ignored by the parser.
# A key with an empty value (e.g. smap.scan.cpu =) means "unset": smap keeps the
# built-in default and does not push anything to the kernel.

# scan period (ms), range 50-60000
smap.scan.period = 200
# migrate period (ms), range 500-300000, must >= smap.scan.period
smap.migrate.period = 2000
# remote freq percentile, range 1-100
smap.remote.freq.percentile = 99
# slow threshold, range 0-(migrate.period/scan.period)
smap.slow.threshold = 2
# freq weight, range 0-65535
smap.freq.wt = 0
# remote hot threshold, range 1-65535
smap.remote.hot.threshold = 65535
# group swap ratio, range 0-10
smap.group.swap.ratio = 1
# group swap min remote freq, range 0-65535
smap.group.swap.min.remote.freq = 0
# group swap min freq gain, range 0-65535
smap.group.swap.min.freq.gain = 0
# group swap local watermark ratio, range 0-100
smap.group.swap.local.watermark.ratio = 95
# ub bandwidth threshold, range 0-65535
smap.ub.bw.threshold = 0
# zero freq migrate enable (true/false)
smap.zero.freq.migrate.enable = true
# adaptive ratio enable (true/false)
smap.adaptive.ratio.enable = true
# period file config switch (true/false)
smap.period.file.config.switch = false
# migrate mode 0=LD_ST 1=URMA
smap.migrate.mode = 0
# Scan CPU binding range, format "min-max", e.g. 0-63 or 35 - 63 (spaces allowed).
#   Binds the scan workqueue and per-pid migrate threads to CPUs [min, max].
#   Both min and max must be within the system's possible CPU range (check
#   /sys/devices/system/cpu/possible, e.g. "0-127"); out-of-range values (like
#   0-200) are discarded with a warning and the previous value is kept.
#   Empty value = unset: not pushed to kernel, kernel default (all CPUs) applies.
smap.scan.cpu =
# remote scan mode 0=soft 1=soft+hard 2=hard
smap.remote.scan.mode = 1
